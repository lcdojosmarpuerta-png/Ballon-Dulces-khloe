<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .cls-navy { fill: #0f2e59; }
      .cls-cyan { fill: #00a8cc; }
      .cls-stroke-cyan { stroke: #00a8cc; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .cls-stroke-navy { stroke: #0f2e59; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .text-title { font-family: 'Montserrat', 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 162px; }
      .text-studio { font-family: 'Montserrat', 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: 4px; }
      .text-tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 21px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Left Circuit Lines (Navy and Cyan) -->
  <g class="circuits-left">
    <!-- Row 1 -->
    <line x1="140" y1="105" x2="205" y2="105" class="cls-stroke-cyan" />
    <circle cx="140" cy="105" r="6.5" class="cls-cyan" />

    <!-- Row 2 -->
    <line x1="125" y1="125" x2="195" y2="125" class="cls-stroke-cyan" />

    <!-- Row 3 -->
    <line x1="95" y1="145" x2="205" y2="145" class="cls-stroke-cyan" />
    <circle cx="95" cy="145" r="5" class="cls-cyan" />

    <!-- Row 4 -->
    <line x1="135" y1="165" x2="215" y2="165" class="cls-stroke-cyan" />
    <circle cx="135" cy="165" r="7" class="cls-cyan" />
    <circle cx="160" cy="185" r="5.5" stroke="#00a8cc" stroke-width="3" fill="#ffffff" />
    <line x1="167" y1="185" x2="225" y2="185" class="cls-stroke-cyan" />

    <!-- Row 5 -->
    <line x1="120" y1="205" x2="225" y2="205" class="cls-stroke-cyan" />
    <circle cx="120" cy="205" r="7" class="cls-cyan" />

    <!-- Row 6 -->
    <line x1="150" y1="225" x2="240" y2="225" class="cls-stroke-cyan" />
    <circle cx="150" cy="225" r="5" class="cls-cyan" />
  </g>

  <!-- Right Circuit Lines (Cyan) -->
  <g class="circuits-right">
    <!-- Row 1 -->
    <line x1="435" y1="105" x2="465" y2="105" class="cls-stroke-cyan" />
    <circle cx="465" cy="105" r="6" class="cls-cyan" />

    <!-- Row 2 -->
    <line x1="430" y1="125" x2="495" y2="125" class="cls-stroke-cyan" />
    <circle cx="495" cy="125" r="6.5" stroke="#00a8cc" stroke-width="3.5" fill="#ffffff" />

    <!-- Row 3 -->
    <line x1="440" y1="145" x2="460" y2="145" class="cls-stroke-cyan" />
    <circle cx="460" cy="145" r="5" class="cls-cyan" />

    <!-- Row 4 -->
    <line x1="445" y1="165" x2="475" y2="165" class="cls-stroke-cyan" />
    <circle cx="475" cy="165" r="6" class="cls-cyan" />

    <!-- Row 5 -->
    <line x1="430" y1="185" x2="515" y2="185" class="cls-stroke-cyan" />
    <circle cx="445" cy="185" r="5" class="cls-cyan" />

    <!-- Row 6 -->
    <line x1="435" y1="205" x2="475" y2="205" class="cls-stroke-cyan" />
    <circle cx="475" cy="205" r="6" stroke="#00a8cc" stroke-width="3.5" fill="#ffffff" />

    <!-- Row 7 -->
    <line x1="420" y1="225" x2="465" y2="225" class="cls-stroke-cyan" />
    <circle cx="465" cy="225" r="6.5" class="cls-cyan" />
  </g>

  <!-- Main S&S Typography -->
  <g class="logo-title">
    <text x="235" y="215" class="text-title cls-navy" text-anchor="middle">S</text>
    <text x="305" y="215" class="text-title cls-navy" text-anchor="middle" font-size="168">&amp;</text>
    <text x="390" y="215" class="text-title cls-cyan" text-anchor="middle">S</text>
  </g>

  <!-- WEB STUDIO text -->
  <text x="300" y="285" class="text-studio cls-navy" text-anchor="middle">WEB STUDIO</text>

  <!-- Tagline text -->
  <text x="300" y="325" class="text-tagline cls-navy" text-anchor="middle">Ideas que conectan tu negocio al mundo.</text>
</svg>
