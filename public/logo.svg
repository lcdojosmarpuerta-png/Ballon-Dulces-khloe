<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad 3D suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#80bbf8" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#f472b6" flood-opacity="0.25" />
    </filter>

    <filter id="balloonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#64748b" flood-opacity="0.28" />
    </filter>

    <filter id="cloudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#fbcfe8" flood-opacity="0.3" />
    </filter>

    <filter id="textBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="1.5" flood-color="#7c3aed" flood-opacity="0.2" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.25" />
    </filter>

    <filter id="textKhloeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#d97706" flood-opacity="0.3" />
    </filter>

    <!-- Gradientes del Arcoíris Neón Pastel -->
    <linearGradient id="rainbowPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="rainbowYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="rainbowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="rainbowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="rainbowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Gradientes de Nubes Suaves 3D -->
    <linearGradient id="cloudBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f0f9ff" />
      <stop offset="80%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="cloudLilacTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5d0fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Gradiente Corona Dorada -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Globos Perlados Esferas 3D -->
    <!-- Globo Azul Cielo Perlado -->
    <radialGradient id="balloonSky" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="65%" stop-color="#60a5fa" />
      <stop offset="95%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <!-- Globo Rosa Pastel Perlado -->
    <radialGradient id="balloonPink" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fce7f3" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="90%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>

    <!-- Globo Lila / Lavanda Perlado -->
    <radialGradient id="balloonLilac" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f3e8ff" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="95%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>

    <!-- Globo Menta / Verde Agua -->
    <radialGradient id="balloonMint" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ccfbf1" />
      <stop offset="65%" stop-color="#5eead4" />
      <stop offset="95%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </radialGradient>

    <!-- Globo Vainilla / Melocotón Perlado -->
    <radialGradient id="balloonPeach" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffedd5" />
      <stop offset="65%" stop-color="#fed7aa" />
      <stop offset="95%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Burbuja Iridiscente Transparente -->
    <radialGradient id="bubbleGlass" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fdf2f8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.45" />
      <stop offset="90%" stop-color="#e9d5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8" />
    </radialGradient>

    <!-- Letras de Ballón Dulces (Rosa a Celeste y Amarillo) -->
    <linearGradient id="textBallonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="textDulcesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="textKhloeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="textFestejosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- CONTENEDOR GENERAL -->
  <g id="logo-root">
    <!-- 1. ARCOÍRIS LUMINOSO SUPERIOR -->
    <g id="rainbow-group" opacity="0.95">
      <!-- Capa 1: Morado/Lila exterior -->
      <path d="M 80 230 A 170 170 0 0 1 420 230" fill="none" stroke="url(#rainbowPurple)" stroke-width="12" stroke-linecap="round" />
      <!-- Capa 2: Azul cielo -->
      <path d="M 92 230 A 158 158 0 0 1 408 230" fill="none" stroke="url(#rainbowBlue)" stroke-width="12" stroke-linecap="round" />
      <!-- Capa 3: Verde menta -->
      <path d="M 104 230 A 146 146 0 0 1 396 230" fill="none" stroke="url(#rainbowGreen)" stroke-width="12" stroke-linecap="round" />
      <!-- Capa 4: Amarillo pastel -->
      <path d="M 116 230 A 134 134 0 0 1 384 230" fill="none" stroke="url(#rainbowYellow)" stroke-width="12" stroke-linecap="round" />
      <!-- Capa 5: Rosa fucsia suave interior -->
      <path d="M 128 230 A 122 122 0 0 1 372 230" fill="none" stroke="url(#rainbowPink)" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Nube pequeña flotante izquierda del arcoíris -->
    <g transform="translate(115, 88)" filter="url(#softGlow)">
      <ellipse cx="25" cy="20" rx="22" ry="16" fill="#ffffff" />
      <circle cx="38" cy="14" r="14" fill="#ffffff" />
      <ellipse cx="50" cy="22" rx="16" ry="12" fill="#f0f9ff" />
    </g>

    <!-- 2. RACIMO DE GLOBOS Y BURBUJAS 3D PERLADOS -->
    <g id="balloons-cluster" filter="url(#balloonShadow)">
      <!-- Fila Trasera -->
      <!-- Globo Azul Grande Central -->
      <circle cx="242" cy="100" r="34" fill="url(#balloonSky)" />
      <ellipse cx="232" cy="88" rx="10" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-30 232 88)" />

      <!-- Globo Rosa Medio Derecha -->
      <circle cx="300" cy="128" r="28" fill="url(#balloonPink)" />
      <ellipse cx="292" cy="118" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30 292 118)" />

      <!-- Globo Melocotón/Dorado -->
      <circle cx="188" cy="140" r="24" fill="url(#balloonPeach)" />
      <ellipse cx="180" cy="132" rx="7" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 180 132)" />

      <!-- Fila Media -->
      <!-- Globo Lavanda -->
      <circle cx="338" cy="168" r="24" fill="url(#balloonLilac)" />
      <ellipse cx="330" cy="160" rx="7" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 330 160)" />

      <!-- Globo Menta Turquesa -->
      <circle cx="152" cy="178" r="25" fill="url(#balloonMint)" />
      <ellipse cx="144" cy="170" rx="7" ry="4" fill="#ffffff" opacity="0.65" transform="rotate(-30 144 170)" />

      <!-- Globo Azul Cielo Frontal -->
      <circle cx="190" cy="172" r="26" fill="url(#balloonSky)" />
      <ellipse cx="182" cy="162" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 182 162)" />

      <!-- Globo Rosa Fucsia Suave -->
      <circle cx="238" cy="160" r="27" fill="url(#balloonPink)" />
      <ellipse cx="230" cy="150" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 230 150)" />

      <!-- Globo Amarillo Pastel Vainilla -->
      <circle cx="288" cy="170" r="27" fill="url(#balloonPeach)" />
      <ellipse cx="280" cy="160" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 280 160)" />

      <!-- Globo Verde Agua Centrado Abajo -->
      <circle cx="256" cy="215" r="26" fill="url(#balloonMint)" />
      <ellipse cx="248" cy="206" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 248 206)" />

      <!-- Burbujas Cristalinas Iridiscentes Delanteras -->
      <circle cx="216" cy="188" r="18" fill="url(#balloonPink)" />
      <circle cx="216" cy="188" r="18" fill="url(#bubbleGlass)" opacity="0.85" />
      <ellipse cx="210" cy="182" rx="6" ry="3.5" fill="#ffffff" opacity="0.8" transform="rotate(-25 210 182)" />

      <circle cx="140" cy="210" r="16" fill="url(#balloonPeach)" />
      <ellipse cx="134" cy="205" rx="5" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-30 134 205)" />

      <circle cx="216" cy="225" r="24" fill="url(#bubbleGlass)" />
      <ellipse cx="208" cy="216" rx="8" ry="4.5" fill="#ffffff" opacity="0.85" transform="rotate(-30 208 216)" />

      <circle cx="340" cy="190" r="24" fill="url(#bubbleGlass)" />
      <ellipse cx="332" cy="180" rx="8" ry="4.5" fill="#ffffff" opacity="0.8" transform="rotate(-30 332 180)" />

      <circle cx="335" cy="235" r="16" fill="url(#balloonLilac)" />
      <ellipse cx="330" cy="229" rx="5" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-30 330 229)" />

      <circle cx="295" cy="225" r="14" fill="url(#bubbleGlass)" />
      <circle cx="170" cy="235" r="16" fill="url(#bubbleGlass)" />
      <circle cx="188" cy="195" r="12" fill="url(#bubbleGlass)" />
      <circle cx="255" cy="180" r="10" fill="url(#bubbleGlass)" />
      <circle cx="308" cy="200" r="12" fill="url(#bubbleGlass)" />
    </g>

    <!-- 3. GRAN NUBE BASE 3D ALMOHADILLADA -->
    <g id="cloud-base" filter="url(#cloudShadow)">
      <!-- Nube Perfil Trasero Suave -->
      <path d="M 90 280 
               C 60 270, 45 310, 55 340 
               C 40 370, 75 410, 115 415 
               C 130 435, 175 455, 220 450 
               C 255 458, 295 455, 335 445 
               C 380 445, 425 425, 440 385 
               C 465 350, 455 305, 420 285 
               C 410 250, 365 240, 330 255 
               C 300 235, 230 235, 190 255 
               C 150 240, 105 250, 90 280 Z"
            fill="url(#cloudBodyGrad)" stroke="#bae6fd" stroke-width="2.5" />

      <!-- Matiz sutil lila / rosa en la nube para volumen 3D -->
      <path d="M 95 285 
               C 70 280, 55 315, 65 340 
               C 55 365, 80 405, 120 410 
               C 145 435, 195 450, 250 445 
               C 310 450, 360 440, 400 415 
               C 440 380, 445 340, 415 295 
               C 380 260, 320 255, 275 270 
               C 220 250, 150 260, 95 285 Z"
            fill="url(#cloudLilacTint)" opacity="0.6" />

      <!-- Brillo superior blanco esponjoso -->
      <ellipse cx="140" cy="275" rx="45" ry="22" fill="#ffffff" opacity="0.8" />
      <ellipse cx="360" cy="285" rx="45" ry="22" fill="#ffffff" opacity="0.8" />
      <ellipse cx="250" cy="265" rx="65" ry="20" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- 4. CORONA DORADA DE PRINCESA (Izquierda de Ballón) -->
    <g transform="translate(108, 232)" filter="url(#textKhloeShadow)">
      <path d="M 0 30 L 7 6 L 18 18 L 29 2 L 40 18 L 51 6 L 58 30 Z" fill="url(#crownGold)" stroke="#d97706" stroke-width="1.2" />
      <circle cx="7" cy="5" r="2.5" fill="#fef08a" />
      <circle cx="29" cy="2" r="3" fill="#fef08a" />
      <circle cx="51" cy="5" r="2.5" fill="#fef08a" />
      <rect x="2" y="27" width="54" height="4" rx="2" fill="#b45309" opacity="0.4" />
    </g>

    <!-- 5. TIPOGRAFÍA DIMENSIONAL 3D -->

    <!-- Texto: Ballón Dulces -->
    <!-- "Ballón" en rosa pastel con degradé celeste -->
    <g filter="url(#textBevel)">
      <text x="290" y="320" text-anchor="middle" font-family="'Great Vibes', 'Dancing Script', 'Brush Script MT', cursive" font-size="52" font-weight="bold">
        <tspan fill="url(#textBallonGrad)" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">Ballón </tspan>
        <tspan fill="url(#textDulcesGrad)" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">Dulces</tspan>
      </text>
    </g>

    <!-- Texto Central: ★ KHLOE ★ (Letras 3D infladas en mayúscula) -->
    <g filter="url(#textKhloeShadow)">
      <!-- Estrella izquierda dorada -->
      <polygon points="152,354 156,364 167,364 158,370 162,380 152,374 142,380 146,370 137,364 148,364" fill="url(#crownGold)" />

      <!-- KHLOE -->
      <text x="250" y="375" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-size="36" font-weight="900" letter-spacing="4">
        <!-- Letra K en celeste pastel -->
        <tspan fill="#7dd3fc" stroke="#ffffff" stroke-width="1.8">K</tspan>
        <!-- Letra H en azul suave -->
        <tspan fill="#93c5fd" stroke="#ffffff" stroke-width="1.8">H</tspan>
        <!-- Letra L en amarillo pastel -->
        <tspan fill="#fde047" stroke="#ffffff" stroke-width="1.8">L</tspan>
        <!-- Letra O en amarillo/melocotón -->
        <tspan fill="#fef08a" stroke="#ffffff" stroke-width="1.8">O</tspan>
        <!-- Letra E en rosa pastel -->
        <tspan fill="#f472b6" stroke="#ffffff" stroke-width="1.8">E</tspan>
      </text>

      <!-- Estrella derecha dorada -->
      <polygon points="348,354 352,364 363,364 354,370 358,380 348,374 338,380 342,370 333,364 344,364" fill="url(#crownGold)" />
    </g>

    <!-- Texto Inferior: Festejos y Decoraciones (Cursiva Pastel) -->
    <g filter="url(#textBevel)">
      <text x="250" y="420" text-anchor="middle" font-family="'Great Vibes', 'Dancing Script', 'Brush Script MT', cursive" font-size="34" font-weight="bold" fill="url(#textFestejosGrad)" stroke="#ffffff" stroke-width="1.2" paint-order="stroke fill">
        Festejos y Decoraciones
      </text>
    </g>
  </g>
</svg>
